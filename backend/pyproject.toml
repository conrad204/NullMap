[project]
name = "nullmap-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "elasticsearch[async]>=9.5.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.11",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.53.0",
    "scipy>=1.15",
    "tiktoken>=0.9",
]

[project.optional-dependencies]
ingest = ["sentence-transformers>=3", "scikit-learn>=1.5"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "playwright>=1.50",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
